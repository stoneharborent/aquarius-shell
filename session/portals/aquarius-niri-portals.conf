# =============================================================================
# Portal backends for the Aquarius Session running on niri
# =============================================================================
# Read the header of aquarius-labwc-portals.conf first — it explains what a
# portal is, and how XDG_CURRENT_DESKTOP decides which of these two files gets
# used. This file only explains what is DIFFERENT about niri.
#
# ../aquarius-session sets XDG_CURRENT_DESKTOP=aquarius-niri:aquarius:niri, so
# the first file xdg-desktop-portal looks for is aquarius-niri-portals.conf —
# this one.
#
# -----------------------------------------------------------------------------
# THE ONE THING THAT IS DIFFERENT, AND WHY IT MATTERS
# -----------------------------------------------------------------------------
# The custom-DE plan says the session should mix xdg-desktop-portal-gtk and
# xdg-desktop-portal-wlr. That is correct FOR LABWC and wrong for niri.
#
# xdg-desktop-portal-wlr captures the screen through the wlr-screencopy
# protocol. niri does not present itself that way to a screen-capture back end;
# it implements the Mutter screen-cast interface instead, which is what
# xdg-desktop-portal-gnome talks to. niri's own documentation says it plainly:
# "xdg-desktop-portal-gnome: required for screencasting support."
#
# So on niri, screen recording needs the GNOME portal, and installing
# xdg-desktop-portal-wlr does not help. This is one of the concrete things the
# P2 compositor gate should weigh: labwc's capture story is the small, focused
# wlr back end; niri's is the much larger GNOME one.
#
# Source, verified: niri documentation, "Important Software".
# =============================================================================

[preferred]

# Try the GNOME back end first, fall back to GTK. This is the order niri itself
# ships, and the fallback matters: xdg-desktop-portal-gnome does not implement
# every interface, and without a second name in the list those go unanswered.
default=gnome;gtk;

# --- screen capture ----------------------------------------------------------
# The niri-specific part. See the note above: NOT wlr.
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome

# --- the file picker ---------------------------------------------------------
# Deliberately GTK rather than GNOME. Since version 47, the GNOME portal opens
# the Nautilus file manager to act as the file chooser, so choosing "gnome" here
# would quietly add Nautilus to the list of things that must be installed or the
# file dialog does nothing. The GTK chooser has no such dependency.
#
# niri's own documentation calls this out as the fix for exactly that problem.
org.freedesktop.impl.portal.FileChooser=gtk

# --- appearance --------------------------------------------------------------
# The line the Aquarius Shell's light/dark switching depends on. Either back end
# answers org.freedesktop.appearance / color-scheme from the same underlying
# GSettings key, so the fallback is harmless. To test it:
#
#     gsettings set org.gnome.desktop.interface color-scheme prefer-dark
#
# and the shell should turn Midnight while you watch. (niri's documentation
# spells the same change as `dconf write /org/gnome/desktop/interface/color-scheme
# '"prefer-dark"'` — the two are the same key by two names.)
org.freedesktop.impl.portal.Settings=gnome;gtk;

# --- prompts and notifications ----------------------------------------------
# GTK, matching niri's own shipped configuration.
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Notification=gtk

# --- passwords ---------------------------------------------------------------
org.freedesktop.impl.portal.Secret=gnome-keyring
