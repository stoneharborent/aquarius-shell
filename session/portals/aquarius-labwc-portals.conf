# =============================================================================
# Portal backends for the Aquarius Session running on labwc
# =============================================================================
# A "portal" is how a sandboxed or well-behaved application asks the desktop to
# do something it is not allowed to do by itself: record the screen, open a file
# picker, show a notification, remember a password. There is one front door
# (xdg-desktop-portal) and several back ends behind it, and this file says which
# back end answers which question.
#
# Get this file wrong and nothing errors. OBS simply shows no screens to record,
# and the file dialog in a Flatpak simply never appears. That silence is why
# this file is commented as heavily as it is.
#
# -----------------------------------------------------------------------------
# HOW THIS FILE GETS FOUND — the part that surprises people
# -----------------------------------------------------------------------------
# xdg-desktop-portal reads XDG_CURRENT_DESKTOP, splits it on colons, and for
# each name looks for `<name>-portals.conf`. ../aquarius-session sets
#
#     XDG_CURRENT_DESKTOP=aquarius-labwc:aquarius:wlroots
#
# so the first file it looks for is aquarius-labwc-portals.conf — this one.
# The name of this file and that environment variable are one mechanism. Rename
# either and screen recording stops working, silently.
#
# Locations are searched highest-precedence-first, and the first is
# $XDG_CONFIG_HOME (~/.config). That is the whole reason you can test this
# session on Bazzite without touching the read-only OS image: this file goes in
# ~/.config/xdg-desktop-portal/ and outranks everything the system ships.
#
# Source, verified: portals.conf(5), xdg-desktop-portal.
#
# -----------------------------------------------------------------------------
# WHY THIS IS NOT THE SAME FILE AS THE NIRI ONE
# -----------------------------------------------------------------------------
# Screen capture is the difference, and it is not a preference — it is a
# protocol fact. labwc is a wlroots compositor and speaks wlr-screencopy, so
# xdg-desktop-portal-wlr can capture it. niri does not work that way and needs
# xdg-desktop-portal-gnome instead. Two compositors, two files. See
# aquarius-niri-portals.conf.
# =============================================================================

[preferred]

# Everything not named below is answered by xdg-desktop-portal-gtk. That covers
# the file chooser, printing, notifications, the "an app wants to do X" prompt,
# and the appearance setting. It is the standard fallback back end and the one
# the wlroots ecosystem has settled on.
default=gtk

# --- screen capture ----------------------------------------------------------
# xdg-desktop-portal-wlr implements exactly two interfaces and nothing else:
# Screenshot and ScreenCast. This is the pair that makes OBS work.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# --- appearance --------------------------------------------------------------
# Listed explicitly even though `default=gtk` already covers it, because this is
# the line the Aquarius Shell's light/dark switching depends on and it should be
# obvious rather than implied.
#
# xdg-desktop-portal-gtk answers org.freedesktop.appearance / color-scheme by
# reading the GSettings key org.gnome.desktop.interface color-scheme, and emits
# SettingChanged when it changes. services/SystemAppearance.qml listens to
# exactly that. To test it:
#
#     gsettings set org.gnome.desktop.interface color-scheme prefer-dark
#
# and the shell should turn Midnight while you watch.
org.freedesktop.impl.portal.Settings=gtk

# --- passwords ---------------------------------------------------------------
# The Secret portal is how applications store passwords. gnome-keyring provides
# it; without this line, some applications refuse to start at all.
org.freedesktop.impl.portal.Secret=gnome-keyring

# --- idle inhibition ---------------------------------------------------------
# "none" means: do not offer this interface. labwc's own shipped configuration
# turns Inhibit off, and we follow it rather than second-guess it.
org.freedesktop.impl.portal.Inhibit=none
